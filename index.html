<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexcent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo"> <img src="logo.svg" alt="logo boshaisi"> Nextcent</div>
        <div class="nav-actions">
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">Features</a>
                <a href="#">Community</a>
                <a href="#">Blog</a>
                <a href="#">Pricing</a>
            </nav>
            <div class="spart">
                <button class="btn">Register Now →</button>
            </div>
        </div>
    </header>


    <section class="hero-section">
        <div class="hero-txt">
            <h1>
                <span class="hero-main">Lessons and insights</span> 
                <span class="hero-span">from 8 years</span> 
            </h1>
            <p>Where to grow your business as a photographer: site or social media?</p>
            <button class="btn">Register</button>
        </div>
        <div class="hero-img">
            <img src="heroimg.svg" alt="hero boisha ase">
        </div>
    </section>

    <section class="our-clients">
        <div class="client-head"><h1>Our Clients</h1></div>
        <div class="client-para"><p>We have been working with some Fortune 500+ clients</p></div>
        <div class="client-logo">
            <img src="clients-img/img1.svg" alt="img1">
            <img src="clients-img/img2.svg" alt="img2">
            <img src="clients-img/img3.svg" alt="img3">
            <img src="clients-img/img4.svg" alt="img4">
            <img src="clients-img/img5.svg" alt="img5">
            <img src="clients-img/img6.svg" alt="img6">
            <img src="clients-img/img3.svg" alt="img7">
        </div>
    </section>

    <section class="manage">
        <h1>Manage your entire community <span>in a single system</span> </h1>
        <p>Who is Nextcent suitable for?</p>
    </section>

    <section class="icons">
        <div class="icon1"><img src="another/member.svg" alt="1"></div>
        <div class="icon2"><img src="another/national.svg" alt="2"></div>
        <div class="icon3"><img src="another/club.svg" alt="3"></div>
    </section>
</body>
</html>
